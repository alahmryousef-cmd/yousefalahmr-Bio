<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yousef Alahmr</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(160deg, #1f140d 0%, #2b1d14 35%, #3d2a1c 70%, #4a3424 100%);
            color: #f5ede0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ====== الخلفية الزخرفية ====== */
        .bg-decoration {
            position: fixed;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.28;
            animation: blob-float 18s ease-in-out infinite;
        }

        .blob:nth-child(1) { width: 380px; height: 380px; background: #8a6a45; top: -120px; left: -120px; animation-delay: 0s; }
        .blob:nth-child(2) { width: 320px; height: 320px; background: #6b5033; bottom: -120px; right: -120px; animation-delay: 5s; }
        .blob:nth-child(3) { width: 260px; height: 260px; background: #a8855c; top: 45%; right: 8%; animation-delay: 9s; }
        .blob:nth-child(4) { width: 240px; height: 240px; background: #7a5c3d; bottom: 15%; left: 3%; animation-delay: 7s; }

        @keyframes blob-float {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(28px,-28px) scale(1.06); }
            66% { transform: translate(-18px,18px) scale(0.96); }
        }

        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(224, 196, 138, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(224, 196, 138, 0.9);
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.7); }
            50% { opacity: 0.9; transform: scale(1.2); }
        }

        .floating-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(201,168,106,0.35), transparent);
            height: 1px;
            border-radius: 2px;
            animation: line-float 14s ease-in-out infinite;
        }

        @keyframes line-float {
            0%, 100% { transform: translateX(0) rotate(0deg); opacity: 0.4; }
            50% { transform: translateX(25px) rotate(1.5deg); opacity: 0.85; }
        }

        /* ====== البطاقة ====== */
        .profile-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 620px;
            background: rgba(43, 29, 20, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 42px;
            padding: 45px 45px 40px;
            text-align: center;
            box-shadow:
                0 24px 55px rgba(0, 0, 0, 0.5),
                0 8px 18px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(232, 220, 200, 0.12);
            border: 1px solid rgba(201, 168, 106, 0.25);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            animation: card-appear 0.9s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes card-appear {
            from { opacity: 0; transform: translateY(35px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow:
                0 32px 70px rgba(0, 0, 0, 0.55),
                0 12px 24px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(232, 220, 200, 0.15);
        }

        /* ====== صورة البروفايل ====== */
        .avatar-wrapper {
            position: relative;
            width: 155px;
            height: 155px;
            margin-bottom: 24px;
            flex-shrink: 0;
        }

        .avatar-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #c9a86a, #e0c48a, #8a6a45, #c9a86a);
            animation: ring-spin 14s linear infinite;
            filter: blur(1.5px);
            opacity: 0.85;
        }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: rgba(43, 29, 20, 0.9);
        }

        @keyframes ring-spin {
            to { transform: rotate(360deg); }
        }

        .profile-pic {
            position: absolute;
            inset: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            border-radius: 50%;
            overflow: hidden;
            background: linear-gradient(135deg, #5a4030, #3d2a1c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 58px;
            color: #e0c48a;
            z-index: 2;
            box-shadow: inset 0 3px 12px rgba(0,0,0,0.35);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ====== الاسم ====== */
        .name {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: 1.8px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #e0c48a 0%, #c9a86a 50%, #d9c5b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            flex-shrink: 0;
        }

        /* ====== الأدوار ====== */
        .roles {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
            width: 100%;
            flex-shrink: 0;
        }

        /* حاوية كل دور مع الفاصل الخاص بيه */
        .role-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 4px;
        }

        /* الوصف الرئيسي - Front-End Web Developer */
        .role-main {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: #e0c48a;
            width: 100%;
            text-align: center;
            line-height: 1.4;
            transition: letter-spacing 0.35s ease;
        }

        .role-main:hover {
            letter-spacing: 4px;
        }

        /* السطر الثانوي - with Extensive Full-Stack Development Experience */
        .role-sub {
            font-size: 11.5px;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-transform: capitalize;
            color: #c9b299;
            width: 100%;
            text-align: center;
            line-height: 1.5;
            padding: 0 10px;
            max-width: 440px;
            transition: color 0.35s ease;
            font-style: italic;
        }

        .role-sub:hover {
            color: #d9c5b0;
        }

        /* الأدوار الإضافية */
        .role {
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #d9c5b0;
            width: 100%;
            padding: 2px 8px;
            border-radius: 6px;
            transition: all 0.35s ease;
            text-align: center;
            line-height: 1.4;
        }

        .role:hover {
            color: #e0c48a;
            background: rgba(201, 168, 106, 0.06);
            letter-spacing: 3.5px;
        }

        /* فاصل صغير بين كل دور واللي بعده */
        .role-separator {
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201, 168, 106, 0.5), transparent);
            margin: 4px auto 0;
        }

        /* ====== الفاصل الرئيسي ====== */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            opacity: 0.9;
            width: 100%;
            flex-shrink: 0;
        }

        .divider-line {
            width: 50px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #c9a86a, transparent);
            border-radius: 2px;
        }

        .divider-diamond {
            color: #c9a86a;
            font-size: 11px;
            transform: rotate(45deg);
            animation: diamond-pulse 3.5s ease-in-out infinite;
        }

        @keyframes diamond-pulse {
            0%, 100% { transform: rotate(45deg) scale(1); opacity: 0.7; }
            50% { transform: rotate(45deg) scale(1.3); opacity: 1; }
        }

        /* ====== الأيقونات ====== */
        .icons-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            margin-bottom: 40px;
            flex-shrink: 0;
        }

        .icons-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            width: 100%;
        }

        .icon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 22px;
            border: 1px solid rgba(201, 168, 106, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: #e8dcc8;
            background: rgba(61, 42, 28, 0.75);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(232, 220, 200, 0.1);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            padding: 0;
        }

        .icon-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 168, 106, 0.25), transparent);
            transition: left 0.7s;
        }

        .icon-btn:hover::before { left: 100%; }

        .icon-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, #5a4030, #3d2a1c);
            color: #e0c48a;
            border-color: rgba(224, 196, 138, 0.6);
            box-shadow: 0 16px 28px rgba(0, 0, 0, 0.45), 0 0 20px rgba(201, 168, 106, 0.2), inset 0 1px 0 rgba(232, 220, 200, 0.15);
        }

        .icon-btn:active { transform: translateY(-2px) scale(0.98); }

        .icon-label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.7px;
            color: #d9c5b0;
            transition: color 0.3s ease;
        }

        .icon-container:hover .icon-label { color: #e0c48a; }

        /* ====== قسم Inspire ====== */
        .inspire-section {
            display: block;
            width: 100%;
            text-decoration: none;
            color: inherit;
            background: linear-gradient(135deg, #f5f5f5 0%, #e6e6e6 100%);
            border-radius: 20px;
            padding: 16px 28px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(201, 168, 106, 0.4);
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .inspire-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(201, 168, 106, 0.7), transparent);
        }

        .inspire-section:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .inspire-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 22px;
        }

        .inspire-logo {
            width: 78px;
            height: 78px;
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.18);
        }

        .inspire-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .inspire-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            gap: 3px;
        }

        .inspire-title {
            font-size: 15.5px;
            font-weight: 700;
            letter-spacing: 0.7px;
            color: #2b1d14;
            line-height: 1.2;
        }

        .inspire-subtitle {
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: #5a4030;
            line-height: 1.2;
            text-transform: uppercase;
        }

        /* ====== الجوال ====== */
        @media (max-width: 700px) {
            body { padding: 20px 14px; }

            .profile-card {
                max-width: 100%;
                padding: 35px 30px 32px;
                border-radius: 32px;
            }

            .avatar-wrapper { width: 125px; height: 125px; margin-bottom: 20px; }
            .profile-pic { font-size: 48px; }
            .name { font-size: 23px; letter-spacing: 1.4px; margin-bottom: 16px; }

            .role-main { font-size: 12.5px; letter-spacing: 2.8px; }
            .role-sub { font-size: 10px; letter-spacing: 1.2px; max-width: 360px; }
            .role { font-size: 10.5px; letter-spacing: 2.5px; }
            .roles { gap: 10px; margin-bottom: 22px; }

            .divider { margin-bottom: 28px; }
            .divider-line { width: 42px; }

            .icons-grid { gap: 24px; margin-bottom: 32px; }
            .icons-row { gap: 30px; }
            .icon-btn { width: 62px; height: 62px; font-size: 24px; border-radius: 19px; }
            .icon-label { font-size: 10.5px; }

            .inspire-section { padding: 14px 22px; border-radius: 17px; }
            .inspire-content { gap: 18px; }
            .inspire-logo { width: 66px; height: 66px; border-radius: 16px; }
            .inspire-title { font-size: 13.5px; }
            .inspire-subtitle { font-size: 11px; letter-spacing: 1.2px; }
        }

        @media (max-width: 480px) {
            .profile-card { padding: 28px 22px 26px; border-radius: 28px; }
            .avatar-wrapper { width: 108px; height: 108px; margin-bottom: 16px; }
            .profile-pic { font-size: 42px; }
            .name { font-size: 20px; letter-spacing: 1.2px; margin-bottom: 14px; }

            .role-main { font-size: 11px; letter-spacing: 2.3px; }
            .role-sub { font-size: 9px; letter-spacing: 1px; max-width: 300px; padding: 0 5px; }
            .role { font-size: 9.5px; letter-spacing: 2.2px; }
            .roles { gap: 8px; margin-bottom: 18px; }

            .divider { margin-bottom: 24px; }
            .divider-line { width: 36px; }

            .icons-grid { gap: 20px; margin-bottom: 26px; }
            .icons-row { gap: 22px; }
            .icon-btn { width: 54px; height: 54px; font-size: 22px; border-radius: 17px; }
            .icon-label { font-size: 9.5px; }

            .inspire-section { padding: 12px 18px; border-radius: 15px; }
            .inspire-content { gap: 15px; }
            .inspire-logo { width: 58px; height: 58px; border-radius: 14px; }
            .inspire-title { font-size: 12px; }
            .inspire-subtitle { font-size: 10px; letter-spacing: 1px; }
        }

        @media (max-width: 380px) {
            .profile-card { padding: 22px 18px 20px; border-radius: 24px; }
            .avatar-wrapper { width: 92px; height: 92px; margin-bottom: 14px; }
            .profile-pic { font-size: 36px; }
            .name { font-size: 17px; letter-spacing: 1px; margin-bottom: 12px; }

            .role-main { font-size: 9.5px; letter-spacing: 2px; }
            .role-sub { font-size: 8px; letter-spacing: 0.8px; max-width: 260px; padding: 0; }
            .role { font-size: 8.5px; letter-spacing: 2px; }
            .roles { gap: 6px; margin-bottom: 16px; }
            .role-separator { width: 24px; margin: 3px auto 0; }

            .divider { margin-bottom: 20px; }
            .divider-line { width: 30px; }

            .icons-grid { gap: 16px; margin-bottom: 22px; }
            .icons-row { gap: 18px; }
            .icon-btn { width: 46px; height: 46px; font-size: 19px; border-radius: 15px; }
            .icon-label { font-size: 8.5px; }

            .inspire-section { padding: 10px 14px; border-radius: 13px; }
            .inspire-content { gap: 12px; }
            .inspire-logo { width: 50px; height: 50px; border-radius: 12px; }
            .inspire-title { font-size: 10.5px; }
            .inspire-subtitle { font-size: 8.5px; letter-spacing: 0.9px; }
        }

        @media (min-width: 1000px) {
            .profile-card { max-width: 640px; padding: 50px 50px 45px; }
            .avatar-wrapper { width: 165px; height: 165px; margin-bottom: 26px; }
            .profile-pic { font-size: 62px; }
            .name { font-size: 32px; margin-bottom: 22px; }

            .role-main { font-size: 16.5px; letter-spacing: 4px; }
            .role-sub { font-size: 13px; letter-spacing: 1.8px; max-width: 480px; }
            .role { font-size: 13px; letter-spacing: 3.5px; }
            .roles { gap: 14px; margin-bottom: 28px; }

            .divider { margin-bottom: 38px; }

            .icons-grid { gap: 34px; margin-bottom: 44px; }
            .icons-row { gap: 46px; }
            .icon-btn { width: 78px; height: 78px; font-size: 30px; border-radius: 24px; }
            .icon-label { font-size: 12.5px; }

            .inspire-section { padding: 18px 32px; border-radius: 22px; }
            .inspire-content { gap: 26px; }
            .inspire-logo { width: 88px; height: 88px; border-radius: 20px; }
            .inspire-title { font-size: 17px; }
            .inspire-subtitle { font-size: 13.5px; letter-spacing: 1.7px; }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const decoration = document.querySelector('.bg-decoration');

            for (let i = 0; i < 18; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = `${Math.random() * 100}%`;
                sparkle.style.top = `${Math.random() * 100}%`;
                sparkle.style.animationDelay = `${Math.random() * 4}s`;
                sparkle.style.width = `${2 + Math.random() * 2.5}px`;
                sparkle.style.height = sparkle.style.width;
                decoration.appendChild(sparkle);
            }

            for (let i = 0; i < 8; i++) {
                const line = document.createElement('div');
                line.className = 'floating-line';
                line.style.width = `${50 + Math.random() * 130}px`;
                line.style.left = `${Math.random() * 90}%`;
                line.style.top = `${Math.random() * 90}%`;
                line.style.animationDelay = `${Math.random() * 14}s`;
                decoration.appendChild(line);
            }

            const icons = document.querySelectorAll('.icon-container');
            icons.forEach((el, i) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(15px)';
                setTimeout(() => {
                    el.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 500 + i * 120);
            });

            const roles = document.querySelectorAll('.role-main, .role-sub, .role');
            roles.forEach((el, i) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    el.style.transition = 'all 0.6s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 350 + i * 130);
            });

            const inspireSection = document.querySelector('.inspire-section');
            if (inspireSection) {
                inspireSection.style.opacity = '0';
                inspireSection.style.transform = 'translateY(15px)';
                setTimeout(() => {
                    inspireSection.style.transition = 'all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    inspireSection.style.opacity = '1';
                    inspireSection.style.transform = 'translateY(0)';
                }, 1200);
            }
        });

        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
